name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows (build, test, package)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Test
        run: dotnet test windows/MonitorSwitcher.slnx -c Release --logger "console;verbosity=normal"

      - name: Publish tray app (small, needs .NET Desktop Runtime)
        run: dotnet publish windows/src/MonitorSwitcher.App -c Release -r win-x64 --self-contained false -o out/small

      - name: Publish tray app (standalone)
        run: dotnet publish windows/src/MonitorSwitcher.App -c Release -r win-x64 --self-contained true -p:PublishReadyToRun=true -o out/standalone

      - name: Publish CLI (Native AOT, renamed to monitorswitcher.com)
        run: dotnet publish windows/src/MonitorSwitcher.Cli -c Release -r win-x64 -o out/cli

      - name: Assemble packages
        run: |
          foreach ($kind in 'small', 'standalone') {
            $dir = "pkg/$kind"
            New-Item -ItemType Directory -Force $dir | Out-Null
            Copy-Item "out/$kind/MonitorSwitcher.exe" $dir
            Copy-Item out/cli/monitorswitcher.com $dir
            Copy-Item README.md, LICENSE $dir
          }
          Get-ChildItem pkg -Recurse | Select-Object FullName, Length | Format-Table -AutoSize

      - uses: actions/upload-artifact@v4
        with:
          name: MonitorSwitcher-windows-x64
          path: pkg/small

      - uses: actions/upload-artifact@v4
        with:
          name: MonitorSwitcher-windows-x64-standalone
          path: pkg/standalone

  macos:
    name: macOS (build, test, package)
    runs-on: macos-latest
    if: ${{ hashFiles('macos/Package.swift') != '' }}
    defaults:
      run:
        shell: bash
        working-directory: macos
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version && xcodebuild -version

      - name: Sync shared profiles and test vectors
        run: bash scripts/sync-shared.sh

      # Compiler errors are turned into annotations so they show up on the commit.
      - name: Build
        run: |
          set -o pipefail
          swift build -c release 2>&1 | tee build.log | sed -E "s#^${GITHUB_WORKSPACE}/##; s#^(macos/[^:]+):([0-9]+):([0-9]+): (error|warning): (.*)\$#::\4 file=\1,line=\2,col=\3::\5#"

      - name: Test
        run: |
          set -o pipefail
          swift test 2>&1 | sed -E "s#^${GITHUB_WORKSPACE}/##; s#^(macos/[^:]+):([0-9]+):([0-9]+): error: (.*)\$#::error file=\1,line=\2,col=\3::\4#"

      - name: Build app bundle
        run: bash scripts/build-app.sh

      - uses: actions/upload-artifact@v4
        with:
          name: MonitorSwitcher-macOS
          path: macos/dist/MonitorSwitcher-macOS.zip
